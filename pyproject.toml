[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts4k"
version = "0.1.0"
description = "Token-efficient messaging gateway for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Test User" },
]
dependencies = [
    "beautifulsoup4>=4.12",
    "html2text>=2024.2",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ts4k = "ts4k.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ts4k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running upstream MCP server (deselected by default)",
]
addopts = "-m 'not integration'"
