[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts4k"
version = "0.1.7"
description = "Token-efficient messaging gateway for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Peter Drier" },
]
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "html2text>=2024.2",
    "httpx>=0.27",
    "mcp>=1.0",
    "msal>=1.28",
]

[project.urls]
Homepage = "https://github.com/peterdrier/ts4k"
Repository = "https://github.com/peterdrier/ts4k"
Issues = "https://github.com/peterdrier/ts4k/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anthropic>=0.40",
]

[project.scripts]
ts4k = "ts4k.cli:main"
ts4k-mcp = "ts4k.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ts4k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running upstream MCP server (deselected by default)",
]
addopts = "-m 'not integration'"
